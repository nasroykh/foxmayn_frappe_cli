name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write     # OIDC token for build-provenance attestation (M4)
  attestations: write # publish the provenance attestation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Fail the release on a broken build, failing tests or go.mod drift,
      # instead of letting GoReleaser publish (or abort on a dirty tree) (D26).
      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # An rc tag and the final tag can sit on the same commit. Without these,
      # GoReleaser picks the tag itself (v1.6.1 was first built as v1.6.1-rc2
      # and failed with already_exists) and diffs the changelog against the rc.
      # Current = the tag that triggered this run; previous = the highest
      # final release below it.
      - name: Resolve release tags
        run: |
          cur="${GITHUB_REF_NAME}"
          base="${cur%%-*}"
          prev=$(git tag --merged HEAD --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | while read -r t; do
                if [ "$t" != "$base" ] && [ "$(printf '%s\n%s\n' "$t" "$base" | sort -V | head -1)" = "$t" ]; then
                  echo "$t"
                  break
                fi
              done)
          echo "GORELEASER_CURRENT_TAG=$cur" >> "$GITHUB_ENV"
          if [ -n "$prev" ]; then echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"; fi
          echo "current=$cur previous=${prev:-none}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.18.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ed25519 seed that signs checksums.txt (tools/relsign).
          FFC_RELEASE_SIGNING_KEY: ${{ secrets.FFC_RELEASE_SIGNING_KEY }}
          # Fine-grained token that pushes the Homebrew cask and the Scoop
          # manifest (Contents read/write on nasroykh/homebrew-tap and
          # nasroykh/scoop-bucket only).
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      # Signed, verifiable provenance for every published archive + checksums (M4).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.mcpb
            dist/checksums.txt
            dist/checksums.txt.sig
