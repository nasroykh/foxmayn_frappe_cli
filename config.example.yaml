# ~/.config/ffc/config.yaml
#
# ffc (Foxmayn Frappe CLI) configuration
# Copy to ~/.config/ffc/config.yaml and fill in your site details.
#
# Multiple sites are supported; use `ffc --site <name> list-docs ...` to switch.
# The `default_site` key selects which site is used when no --site flag is given.

default_site: dev

# Number format for displaying amounts in tables and reports.
# Run `ffc config set --number-format <value>` (or `ffc config`) to change.
# Options: french (default) | us | german | plain
#   french  →  1 000 000,00
#   us      →  1,000,000.00
#   german  →  1.000.000,00
#   plain   →  1000000.00
number_format: french

# Date format for displaying dates in tables and reports.
# Run `ffc config set --date-format <value>` (or `ffc config`) to change.
# Options: yyyy-mm-dd (default) | dd-mm-yyyy | dd/mm/yyyy | mm/dd/yyyy
date_format: yyyy-mm-dd

sites:
  # API key / secret auth (User → API Access → Generate Keys).
  dev:
    url: "http://mysite.localhost:8000"
    api_key: "your_api_key_here"
    api_secret: "your_api_secret_here"

  # OAuth 2.0 auth — set up with `ffc site add` (tokens are managed for you).
  # oauth-site:
  #   url: "https://erp.company.com"
  #   oauth_client_id: "..."
  #   access_token: "..."
  #   refresh_token: "..."

  # Username / password (session-cookie) auth.
  # NOTE: this stores your *account password* in cleartext in this file (0600).
  # Prefer OAuth or a scoped API key where possible.
  # password-site:
  #   url: "https://erp.company.com"
  #   username: "user@example.com"
  #   password: "your_password"
