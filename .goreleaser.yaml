version: 2

project_name: ffc

# Completion scripts and man pages for the archives (tools/gendocs). They are
# generated, not committed: completions/ and manpages/ are gitignored.
# The commit time dates the man pages, so a rebuild of a tag gives the same
# files. (A global env entry cannot carry it: GoReleaser renders those before
# it reads git, so .CommitTimestamp is still zero there.)
before:
  hooks:
    - go run ./tools/gendocs . {{ .Version }} {{ .CommitTimestamp }}

builds:
  - id: ffc
    main: ./cmd/ffc
    binary: ffc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/nasroykh/foxmayn_frappe_cli/internal/version.Version={{ .Version }}
      - -X github.com/nasroykh/foxmayn_frappe_cli/internal/version.Commit={{ .Commit }}
      - -X github.com/nasroykh/foxmayn_frappe_cli/internal/version.Date={{ .Date }}

archives:
  - id: ffc
    name_template: "ffc_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - completions/*
      - manpages/*

checksum:
  name_template: "checksums.txt"

# Sign checksums.txt with the release key (tools/relsign, Ed25519). ffc update
# refuses a release without a valid checksums.txt.sig. relsign reads
# FFC_RELEASE_SIGNING_KEY from the inherited process environment and fails when
# it is unset or does not match relsig.ReleaseKeys, so a release cannot publish
# an unverifiable signature. Do not add a signs.env entry that templates
# {{ .Env.X }}: GoReleaser evaluates those against the earlier signs.env
# entries only, not the process environment, so it always fails.
signs:
  - id: checksums
    artifacts: checksum
    cmd: go
    args: ["run", "./tools/relsign", "sign", "${artifact}", "${signature}"]
    signature: "${artifact}.sig"

# Package managers (T3.5). Both push to their own repository with
# TAP_GITHUB_TOKEN (a fine-grained token: Contents read/write on
# nasroykh/homebrew-tap and nasroykh/scoop-bucket only; the workflow's
# GITHUB_TOKEN cannot write another repository). skip_upload: auto keeps rc
# tags out. ffc update refuses to replace either copy (release.ManagedBy).
homebrew_casks:
  - name: ffc
    binaries: [ffc]
    manpages:
      - manpages/*.1
    completions:
      bash: completions/ffc.bash
      zsh: completions/ffc.zsh
      fish: completions/ffc.fish
    homepage: https://github.com/nasroykh/foxmayn_frappe_cli
    description: Command-line client and MCP server for Frappe and ERPNext sites
    license: MIT
    skip_upload: auto
    repository:
      owner: nasroykh
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    # The binary is not signed or notarized (no Apple Developer ID). Without
    # this, macOS refuses to run a quarantined download from a cask.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/ffc"]
          end

scoops:
  - name: ffc
    homepage: https://github.com/nasroykh/foxmayn_frappe_cli
    description: Command-line client and MCP server for Frappe and ERPNext sites
    license: MIT
    skip_upload: auto
    repository:
      owner: nasroykh
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"

release:
  prerelease: auto # a tag like v1.6.0-rc1 must not become /releases/latest

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
