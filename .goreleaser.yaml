version: 2

project_name: ffc

builds:
  - id: ffc
    main: ./cmd/ffc
    binary: ffc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/nasroykh/foxmayn_frappe_cli/internal/version.Version={{ .Version }}
      - -X github.com/nasroykh/foxmayn_frappe_cli/internal/version.Commit={{ .Commit }}
      - -X github.com/nasroykh/foxmayn_frappe_cli/internal/version.Date={{ .Date }}

archives:
  - id: ffc
    name_template: "ffc_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

# Sign checksums.txt with the release key (tools/relsign, Ed25519). ffc update
# refuses a release without a valid checksums.txt.sig. relsign also refuses a
# key that does not match relsig.ReleaseKeys, and the template fails when the
# secret is unset, so a release cannot publish an unverifiable signature.
signs:
  - id: checksums
    artifacts: checksum
    cmd: go
    args: ["run", "./tools/relsign", "sign", "${artifact}", "${signature}"]
    signature: "${artifact}.sig"
    env:
      - "FFC_RELEASE_SIGNING_KEY={{ .Env.FFC_RELEASE_SIGNING_KEY }}"

release:
  prerelease: auto # a tag like v1.6.0-rc1 must not become /releases/latest

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch
